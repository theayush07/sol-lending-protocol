[package]
name = "lending"
version = "0.1.0"
description = "Over-collateralized Solana Lending Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lending"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
mock-oracle = { path = "../mock-oracle", features = ["no-entrypoint"] }
proc-macro2 = { version = "*", features = ["span-locations"] }

[build-dependencies]
proc-macro2 = { version = "*", features = ["span-locations"] }