version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: sollend_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: sollend
      POSTGRES_PASSWORD: sollend_dev_password
      POSTGRES_DB: sollend_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sollend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sollend_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  pgdata: